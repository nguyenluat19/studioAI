name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg redis-server fonts-dejavu-core
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest -q
